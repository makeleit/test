<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KASPIY — Возраст 8–10 · Строй фундамент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#1e7bff; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#222;font-family:'Oswald',sans-serif;}

  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;background:#0b0f16;}

  .photo{
    position:absolute;top:0;right:0;width:62%;height:100%;
    background:
      radial-gradient(70% 50% at 60% 75%, rgba(30,123,255,.18), transparent 70%),
      linear-gradient(180deg,#171c26 0%, #0d1018 100%);
  }
  .photo::after{ /* faint gym lines */
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 90px);
  }
  .player2{position:absolute;right:-10px;bottom:0;height:96%;width:auto;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,#0b0f16 28%, rgba(11,15,22,.45) 52%, transparent 72%);}

  .content{position:relative;z-index:3;padding:64px 56px;height:100%;display:flex;flex-direction:column;}

  .tag{align-self:flex-start;background:var(--blue);font-family:'Anton';font-size:44px;letter-spacing:1px;padding:8px 28px;border-radius:10px;transform:skewX(-6deg);box-shadow:0 8px 26px rgba(30,123,255,.4);}
  .tag span{display:inline-block;transform:skewX(6deg);}

  h1{font-family:'Anton';text-transform:uppercase;line-height:.9;margin:28px 0 6px;}
  h1 .w{font-size:128px;color:#fff;}
  h1 .b{font-size:128px;color:var(--blue);}
  .rule{width:340px;height:5px;background:linear-gradient(90deg,var(--blue),transparent);margin:26px 0 48px;}

  .list{display:flex;flex-direction:column;gap:38px;flex:1;}
  .item{display:flex;gap:28px;align-items:flex-start;}
  .ic{width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;}
  .ic svg{width:60px;height:60px;stroke:var(--blue);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .it-txt h3{font-family:'Oswald';font-weight:700;font-size:38px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
  .it-txt p{font-size:27px;color:#aab4c4;font-weight:400;margin-top:4px;line-height:1.25;}

  .foot{margin-top:30px;}
  .foot .l1{font-family:'Anton';font-size:54px;color:var(--blue);letter-spacing:1px;text-transform:uppercase;}
  .foot .l2{font-family:'Anton';font-size:54px;color:#fff;letter-spacing:1px;text-transform:uppercase;}
  .foot .bar{width:210px;height:7px;background:var(--blue);margin-top:16px;border-radius:4px;}
</style>
</head>
<body>
  <div class="poster">
    <div class="photo">
      <svg class="player2" viewBox="0 0 360 580" aria-hidden="true">
        <!-- back leg (player's, image-left) -->
        <path d="M170 300 q-30 60 -42 108 q-6 22 2 60 l22 0 q2 -34 8 -54 q16 -52 40 -96 z" fill="#d79f73"/>
        <!-- front leg -->
        <path d="M212 300 q34 56 50 104 q8 24 4 64 l-22 0 q0 -34 -8 -56 q-16 -48 -42 -88 z" fill="#e7b48d"/>
        <!-- shoes -->
        <path d="M138 462 h30 v12 q0 10 -12 10 h-26 q-8 0 -8 -8 q0 -8 8 -12 z" fill="#101216"/>
        <path d="M232 466 h32 q8 4 8 12 q0 8 -8 8 h-26 q-12 0 -12 -10 z" fill="#171a20"/>
        <path d="M118 484 h44 v6 h-38 q-6 0 -6 -6z" fill="#eef1f6"/>
        <path d="M236 486 h44 q0 6 -6 6 h-38z" fill="#eef1f6"/>
        <!-- shorts -->
        <path d="M150 286 q60 -16 120 0 q10 2 8 22 l-10 60 q-1 12 -14 12 l-30 0 -6 -52 -4 0 -8 52 -30 0 q-13 0 -14 -12 l-10 -60 q-2 -20 8 -22z" fill="#15181f"/>
        <path d="M210 312 v74" stroke="#0a0b0e" stroke-width="2.5"/>
        <!-- torso / tank -->
        <path d="M158 150 q52 -18 104 0 l16 142 q-68 22 -136 0 z" fill="#1c1f27"/>
        <path d="M180 144 l30 12 30 -12 -10 150 h-40 z" fill="#23262f"/>
        <path d="M170 158 q40 -14 80 0" stroke="#aeb6c4" stroke-width="2.5" fill="none" opacity=".5"/>
        <!-- left arm bent up (balance) -->
        <path d="M165 162 q-34 8 -52 40 q-10 18 -6 40 l18 -4 q-2 -18 6 -32 q14 -22 42 -28 z" fill="#d79f73"/>
        <!-- right arm reaching down to ball -->
        <path d="M255 160 q40 18 56 70 q10 34 -4 70 l-20 -8 q8 -28 0 -52 q-12 -40 -52 -56 z" fill="#e7b48d"/>
        <!-- hand on ball -->
        <ellipse cx="292" cy="386" rx="20" ry="14" fill="#e7b48d" transform="rotate(18 292 386)"/>
        <!-- ball -->
        <circle cx="296" cy="430" r="40" fill="#d2772f"/>
        <path d="M296 390 v80 M256 430 h80 M266 400 q30 30 0 60 M326 400 q-30 30 0 60" stroke="#8f4a18" stroke-width="3" fill="none"/>
        <!-- neck + head (looking forward/down) -->
        <path d="M196 134 h28 v22 q-14 8 -28 0 z" fill="#e7b48d"/>
        <circle cx="212" cy="98" r="40" fill="#eebb91"/>
        <!-- ear -->
        <circle cx="178" cy="100" r="7" fill="#e0a87e"/>
        <!-- hair -->
        <path d="M173 96 q-6 -46 39 -50 q44 3 41 48 q-8 -20 -22 -22 q6 10 2 18 q-10 -22 -34 -18 q-20 4 -26 26 z" fill="#241a12"/>
      </svg>
    </div>
    <div class="scrim"></div>

    <div class="content">
      <div class="tag"><span>ВОЗРАСТ 8–10</span></div>
      <h1><div class="w">СТРОЙ</div><div class="b">ФУНДАМЕНТ</div></h1>
      <div class="rule"></div>

      <div class="list">
        <div class="item">
          <div class="ic"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/><path d="M50 10v80M10 50h80M22 22c14 12 14 44 0 56M78 22c-14 12-14 44 0 56"/></svg></div>
          <div class="it-txt"><h3>Ведение мяча</h3><p>Контроль. Уверенность. Креатив.</p></div></div>
        <div class="item">
          <div class="ic"><svg viewBox="0 0 100 100"><circle cx="32" cy="32" r="14"/><path d="M10 84c0-16 10-26 22-26s22 10 22 26"/><circle cx="70" cy="38" r="11"/><path d="M58 84c0-13 7-21 16-21s16 8 16 21" opacity=".9"/></svg></div>
          <div class="it-txt"><h3>Пас</h3><p>Принимай верное решение.</p></div></div>
        <div class="item">
          <div class="ic"><svg viewBox="0 0 100 100"><path d="M18 24h64"/><path d="M24 24v18a26 26 0 0052 0V24"/><path d="M30 60l4 26M70 60l-4 26M34 86h32"/></svg></div>
          <div class="it-txt"><h3>Броски из-под кольца</h3><p>Завершай обеими руками.</p></div></div>
        <div class="item">
          <div class="ic"><svg viewBox="0 0 100 100"><path d="M30 70c-8 0-14-8-14-22 0-12 6-22 14-22s12 10 12 22c0 8 4 12 4 18 0 6-4 10-10 10s-6-6-6-6z"/><circle cx="64" cy="30" r="6"/><circle cx="76" cy="40" r="5"/><circle cx="80" cy="54" r="5"/></svg></div>
          <div class="it-txt"><h3>Работа ног</h3><p>Баланс. Ловкость. Быстрота.</p></div></div>
        <div class="item">
          <div class="ic"><svg viewBox="0 0 100 100"><path d="M50 50c8-14 18-20 28-12s8 22-4 24-22-8-24-12-12-20-24-12-12 18-4 24 20 0 28-12z"/></svg></div>
          <div class="it-txt"><h3>Играй как можно больше</h3><p>Повторения строят навык. Игры строят тебя.</p></div></div>
      </div>

      <div class="foot">
        <div class="l1">Развитие навыков</div>
        <div class="l2">важнее трофеев.</div>
        <div class="bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
